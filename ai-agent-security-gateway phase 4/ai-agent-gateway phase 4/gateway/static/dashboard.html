<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent Security Gateway — Dashboard</title>
<style>
  :root {
    --bg: #0f1b2e;
    --panel: #16243d;
    --panel-border: #223757;
    --text: #e8edf5;
    --text-dim: #93a3bd;
    --accent: #2dd4c8;
    --accent-dim: #1c9a91;
    --allow: #34d399;
    --deny: #f87171;
    --pending: #fbbf24;
    --blocked: #9ca3af;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  #conn-status { font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  #conn-status.ok { background: rgba(52,211,153,0.15); color: var(--allow); }
  #conn-status.bad { background: rgba(248,113,113,0.15); color: var(--deny); }

  main { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }

  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 24px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat-card .value { font-size: 26px; font-weight: 700; }
  .stat-card .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 4px; }
  .stat-card.warn .value { color: var(--pending); }
  .stat-card.danger .value { color: var(--deny); }

  .grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } .stats { grid-template-columns: repeat(3, 1fr); } }

  .panel {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius);
    padding: 18px 18px 20px; margin-bottom: 20px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; }
  .panel h2 .count { color: var(--text-dim); font-weight: 400; font-size: 12px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--text-dim); padding: 6px 8px; border-bottom: 1px solid var(--panel-border); }
  td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12.5px; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .muted { color: var(--text-dim); }
  .mono { font-family: "SF Mono", Consolas, monospace; font-size: 12px; }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
  .badge.ALLOW { background: rgba(52,211,153,0.15); color: var(--allow); }
  .badge.DENY { background: rgba(248,113,113,0.15); color: var(--deny); }
  .badge.PENDING_APPROVAL { background: rgba(251,191,36,0.15); color: var(--pending); }
  .badge.BLOCKED { background: rgba(156,163,175,0.2); color: var(--blocked); }
  .badge.ACTIVE { background: rgba(52,211,153,0.15); color: var(--allow); }
  .badge.DISABLED { background: rgba(248,113,113,0.15); color: var(--deny); }

  button {
    background: var(--accent-dim); color: white; border: none; border-radius: 6px;
    padding: 5px 11px; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  button:hover { background: var(--accent); }
  button.secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--text-dim); }
  button.secondary:hover { color: var(--text); border-color: var(--text-dim); }
  button.danger { background: rgba(248,113,113,0.15); color: var(--deny); }
  button.danger:hover { background: rgba(248,113,113,0.3); }
  button.small { padding: 3px 8px; font-size: 11px; margin-right: 4px; }

  input, select, textarea {
    background: #0d1830; border: 1px solid var(--panel-border); color: var(--text);
    border-radius: 6px; padding: 7px 10px; font-size: 12.5px; width: 100%; font-family: inherit;
  }
  label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; margin-top: 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-actions { margin-top: 14px; display: flex; gap: 8px; }

  .reasons { margin: 6px 0 0; padding-left: 16px; color: var(--text-dim); font-size: 11.5px; }
  .reasons li { margin-bottom: 2px; }

  .result-box {
    margin-top: 14px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--panel-border);
    background: #0d1830; display: none;
  }
  .result-box.show { display: block; }
  .result-box .score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .result-box .score { font-size: 20px; font-weight: 700; }

  .empty { color: var(--text-dim); font-size: 12px; padding: 10px 0; text-align: center; }
  .toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--panel); border: 1px solid var(--accent);
    color: var(--text); padding: 10px 16px; border-radius: 8px; font-size: 12.5px; opacity: 0;
    transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div>
    <h1>AI Agent <span>Security Gateway</span></h1>
    <div class="sub">Identity → Permission → Risk → Policy → Audit</div>
  </div>
  <div id="conn-status">connecting…</div>
</header>

<main>

  <div class="stats" id="stats"></div>

  <div class="grid">
    <!-- LEFT COLUMN -->
    <div>
      <div class="panel">
        <h2>Agents <span class="count" id="agent-count"></span></h2>
        <table id="agents-table">
          <thead><tr><th>Name</th><th>Trust</th><th>Status</th><th></th></tr></thead>
          <tbody></tbody>
        </table>

        <label>New agent name</label>
        <div class="row">
          <input id="new-agent-name" placeholder="e.g. FinanceBot">
          <select id="new-agent-trust">
            <option value="LOW">LOW trust</option>
            <option value="MEDIUM" selected>MEDIUM trust</option>
            <option value="HIGH">HIGH trust</option>
          </select>
        </div>
        <div class="form-actions">
          <button onclick="createAgent()">Create agent</button>
        </div>
      </div>

      <div class="panel">
        <h2>Grant permission</h2>
        <label>Agent</label>
        <select id="perm-agent"></select>
        <div class="row">
          <div>
            <label>Action</label>
            <select id="perm-action">
              <option>READ</option><option>WRITE</option><option>UPDATE</option>
              <option>SEND</option><option>DELETE</option><option>MODIFY_CONFIG</option>
              <option>ADMIN</option><option>VISIT</option><option>DOWNLOAD</option>
              <option>PROCESS_CONTENT</option>
            </select>
          </div>
          <div>
            <label>Resource</label>
            <input id="perm-resource" placeholder="e.g. invoices, web, content">
          </div>
        </div>
        <div class="form-actions">
          <button onclick="grantPermission()">Grant permission</button>
        </div>
      </div>

      <div class="panel">
        <h2>Try a request</h2>
        <label>Agent</label>
        <select id="try-agent"></select>
        <div class="row">
          <div>
            <label>Action</label>
            <select id="try-action">
              <option>READ</option><option>WRITE</option><option>UPDATE</option>
              <option>SEND</option><option>DELETE</option><option>MODIFY_CONFIG</option>
              <option>ADMIN</option><option>VISIT</option><option>DOWNLOAD</option>
              <option>PROCESS_CONTENT</option>
            </select>
          </div>
          <div>
            <label>Scope</label>
            <select id="try-scope">
              <option>SINGLE</option><option>SUBSET</option><option>BULK</option><option>ALL</option>
            </select>
          </div>
        </div>
        <label>Resource / URL / content</label>
        <textarea id="try-resource" rows="3" placeholder="e.g. production_database, https://example.com, or a block of email text"></textarea>
        <div class="form-actions">
          <button onclick="tryRequest()">Send to gateway</button>
        </div>

        <div class="result-box" id="try-result">
          <div class="score-row">
            <span class="badge" id="try-decision-badge"></span>
            <span class="score" id="try-score"></span>
          </div>
          <ul class="reasons" id="try-reasons"></ul>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div>
      <div class="panel">
        <h2>Pending approvals <span class="count" id="approval-count"></span></h2>
        <div id="approvals-list"></div>
      </div>

      <div class="panel">
        <h2>Live audit log <span class="count">last 20</span></h2>
        <table id="audit-table">
          <thead><tr><th>Agent</th><th>Action</th><th>Resource</th><th>Risk</th><th>Decision</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
const REFRESH_MS = 4000;
let agentsCache = [];

async function api(path, options) {
  const res = await fetch(path, options);
  const body = await res.json();
  if (!res.ok) {
    throw new Error(body.error || ('HTTP ' + res.status));
  }
  return body;
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = isError ? 'var(--deny)' : 'var(--accent)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function refreshStats() {
  try {
    const s = await api('/dashboard/summary');
    document.getElementById('conn-status').textContent = 'connected';
    document.getElementById('conn-status').className = 'ok';
    const cards = [
      ['total_agents', 'Total agents', false],
      ['active_agents', 'Active agents', false],
      ['actions_today', 'Actions today', false],
      ['blocked_today', 'Blocked today', s.blocked_today > 0],
      ['high_risk_today', 'High risk today', s.high_risk_today > 0],
      ['pending_approvals', 'Pending approvals', s.pending_approvals > 0],
    ];
    document.getElementById('stats').innerHTML = cards.map(([key, label, warn]) => `
      <div class="stat-card ${warn ? 'warn' : ''}">
        <div class="value">${s[key]}</div>
        <div class="label">${label}</div>
      </div>`).join('');
  } catch (e) {
    document.getElementById('conn-status').textContent = 'disconnected';
    document.getElementById('conn-status').className = 'bad';
  }
}

async function refreshAgents() {
  const agents = await api('/agents');
  agentsCache = agents;
  document.getElementById('agent-count').textContent = agents.length;

  document.querySelector('#agents-table tbody').innerHTML = agents.map(a => `
    <tr>
      <td>${esc(a.name)}<div class="muted">#${a.id} · ${esc(a.owner || 'no owner')}</div></td>
      <td>${esc(a.trust_level)}</td>
      <td><span class="badge ${a.status}">${a.status}</span></td>
      <td>
        ${a.status === 'ACTIVE'
          ? `<button class="small danger" onclick="disableAgent(${a.id})">Disable</button>`
          : `<button class="small secondary" onclick="enableAgent(${a.id})">Enable</button>`}
      </td>
    </tr>`).join('') || `<tr><td colspan="4" class="empty">No agents yet — create one below.</td></tr>`;

  const options = agents.map(a => `<option value="${a.id}">${esc(a.name)} (#${a.id})</option>`).join('');
  document.getElementById('perm-agent').innerHTML = options || '<option value="">No agents</option>';
  document.getElementById('try-agent').innerHTML = options || '<option value="">No agents</option>';
}

async function refreshApprovals() {
  const approvals = await api('/approvals?status=PENDING');
  document.getElementById('approval-count').textContent = approvals.length;
  const list = document.getElementById('approvals-list');
  if (!approvals.length) {
    list.innerHTML = `<div class="empty">No pending approvals.</div>`;
    return;
  }
  list.innerHTML = approvals.map(ap => `
    <div style="border:1px solid var(--panel-border); border-radius:8px; padding:10px 12px; margin-bottom:8px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span class="mono">agent #${ap.agent_id} · ${esc(ap.action)}</span>
        <span class="badge PENDING_APPROVAL">risk ${ap.risk_score}</span>
      </div>
      <div class="muted mono" style="word-break:break-word; margin-bottom:8px;">${esc(ap.resource)}</div>
      <button class="small" onclick="resolveApproval(${ap.id}, true)">Approve</button>
      <button class="small danger" onclick="resolveApproval(${ap.id}, false)">Deny</button>
    </div>`).join('');
}

async function refreshAudit() {
  const logs = await api('/audit?limit=20');
  document.querySelector('#audit-table tbody').innerHTML = logs.map(l => `
    <tr>
      <td class="mono">#${l.agent_id}</td>
      <td>${esc(l.action)}</td>
      <td class="mono" style="max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${esc(l.resource)}">${esc(l.resource)}</td>
      <td>${l.risk_score}</td>
      <td><span class="badge ${l.decision}">${l.decision.replace('_',' ')}</span></td>
    </tr>`).join('') || `<tr><td colspan="5" class="empty">No activity yet.</td></tr>`;
}

async function refreshAll() {
  await Promise.all([refreshStats(), refreshAgents(), refreshApprovals(), refreshAudit()]);
}

async function createAgent() {
  const name = document.getElementById('new-agent-name').value.trim();
  const trust_level = document.getElementById('new-agent-trust').value;
  if (!name) { showToast('Enter an agent name', true); return; }
  try {
    await api('/agents', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name, trust_level}) });
    document.getElementById('new-agent-name').value = '';
    showToast(`Agent "${name}" created`);
    refreshAll();
  } catch (e) { showToast(e.message, true); }
}

async function enableAgent(id) {
  await api(`/agents/${id}/enable`, { method: 'POST' });
  showToast('Agent enabled');
  refreshAll();
}
async function disableAgent(id) {
  await api(`/agents/${id}/disable`, { method: 'POST' });
  showToast('Agent disabled (kill switch)');
  refreshAll();
}

async function grantPermission() {
  const agentId = document.getElementById('perm-agent').value;
  const action = document.getElementById('perm-action').value;
  const resource = document.getElementById('perm-resource').value.trim();
  if (!agentId || !resource) { showToast('Choose an agent and a resource', true); return; }
  try {
    await api(`/agents/${agentId}/permissions`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action, resource, allowed: true })
    });
    showToast(`Granted ${action} on "${resource}"`);
    document.getElementById('perm-resource').value = '';
  } catch (e) { showToast(e.message, true); }
}

async function tryRequest() {
  const agent_id = document.getElementById('try-agent').value;
  const action = document.getElementById('try-action').value;
  const resource = document.getElementById('try-resource').value.trim();
  const scope = document.getElementById('try-scope').value;
  if (!agent_id || !resource) { showToast('Choose an agent and enter a resource', true); return; }
  try {
    const result = await api('/gateway/request', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ agent_id: Number(agent_id), action, resource, scope })
    });
    const box = document.getElementById('try-result');
    box.classList.add('show');
    document.getElementById('try-decision-badge').className = 'badge ' + result.decision;
    document.getElementById('try-decision-badge').textContent = result.decision.replace('_', ' ');
    document.getElementById('try-score').textContent = 'risk ' + result.risk_score;
    document.getElementById('try-reasons').innerHTML = result.reasons.map(r => `<li>${esc(r)}</li>`).join('');
    refreshAll();
  } catch (e) { showToast(e.message, true); }
}

async function resolveApproval(id, approve) {
  await api(`/approvals/${id}/${approve ? 'approve' : 'deny'}`, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({resolved_by:'dashboard'})
  });
  showToast(approve ? 'Approved' : 'Denied');
  refreshAll();
}

refreshAll();
setInterval(refreshAll, REFRESH_MS);
</script>

</body>
</html>
